# 构建检查只生成明确标识的开发包；正式离线发行需审核工具材料后单独执行release.py。
name: Cross-platform build
on:
  # 推送时核对三目标共享内核。
  push:
  # 合并请求执行同样的检查。
  pull_request:
  # 维护者可手动运行，不自动发布release。
  workflow_dispatch:
# CI只读取源码，不写仓库或发布镜像。
permissions:
  # checkout所需最小权限。
  contents: read
jobs:
  # Windows实机编译与Linux两架构交叉构建分别留出证据。
  build:
    # 使用矩阵中的宿主系统。
    runs-on: ${{ matrix.host }}
    # 失败不取消其他平台的证据。
    strategy:
      # 保留全部目标结果。
      fail-fast: false
      # Linux arm64在amd64 runner交叉编译，不冒充ARM实机运行。
      matrix:
        # 明确每个发布目标和构建宿主。
        include:
          # Windows原生入口与共享核心。
          - host: windows-latest
            # Windows首批目标。
            target: windows-amd64
          # Linux headless amd64。
          - host: ubuntu-latest
            # Linux常见NAS架构。
            target: linux-amd64
          # Linux ARM64交叉编译。
          - host: ubuntu-latest
            # 不宣称本runner实际执行ARM程序。
            target: linux-arm64
    # 所有平台使用同一发布脚本。
    steps:
      # 获取待检查源码。
      - uses: actions/checkout@v4
      # 固定与Dockerfile一致的Go工具链。
      - uses: actions/setup-go@v5
        # 构建工具参数。
        with:
          # 项目已验证的Go版本。
          go-version: '1.27.4'
      # 固定前端构建主版本与当前镜像一致。
      - uses: actions/setup-node@v4
        # Node参数。
        with:
          # 与Dockerfile一致的版本。
          node-version: '22.14.0'
      # Python仅供构建机打包，不是终端用户依赖。
      - uses: actions/setup-python@v5
        # Python参数。
        with:
          # 使用稳定的Python 3.12。
          python-version: '3.12'
      # 对宿主平台运行静态检查和可用测试。
      - name: Go checks
        # 两条独立命令，任一失败即停止步骤。
        run: |
          go vet ./...
          go test ./...
      # 严格前端检查由npm build中的vue-tsc执行。
      - name: Build development package
        # 缺少正式工具清单的CI成品名称和元数据均标明development。
        run: python scripts/release.py --target ${{ matrix.target }} --go go --development-without-tools
      # 保留可重复运行的打包边界回归。
      - name: Verify release boundaries
        # 不启动Docker或修改宿主设置。
        run: python scripts/verify_release.py --self-test
      # CI附件用于人工测试，不自动发布正式版本。
      - uses: actions/upload-artifact@v4
        # 附件参数。
        with:
          # 名称明确含开发验证标识。
          name: qiku-${{ matrix.target }}-development
          # 归档和外部摘要。
          path: bin/releases/*
          # 不保留冗余的长期开发归档。
          retention-days: 7
