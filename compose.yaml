# 单服务部署：在仓库根目录执行 docker compose up -d --build。
services:
  # 应用同时提供网页、API、SQLite 与后台扫描任务。
  nas:
    # 本地构建镜像名称；当前没有声称已发布的公共镜像。
    image: nas-content-manager:0.1.0
    # 构建上下文为包含 Dockerfile 的项目目录。
    build: .
    # 重启 NAS 后自动恢复应用；手动停止后保持停止。
    restart: unless-stopped
    # 宿主端口可在 .env 中修改；容器端口固定为 8090。
    ports:
      - "${WEB_PORT:-8090}:8090"
    # 默认使用本机命名卷存储 SQLite，媒体目录只读挂载。
    volumes:
      - nas_data:/data
      - ${MEDIA_PATH:-./media}:/media:ro
    # 高级参数可保持默认，每项的含义与单位在此说明。
    environment:
      # 定期重新扫描间隔，单位分钟。
      NAS_SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      # 可重建封面缓存最大容量，单位 MiB。
      NAS_CACHE_MAX_MB: ${CACHE_MAX_MB:-1024}
      # 生成缓存前必须保留的剩余空间，单位 MiB。
      NAS_MIN_FREE_MB: ${MIN_FREE_MB:-512}
      # 后台处理并发数，低配置 NAS 建议保持 1。
      NAS_WORKERS: ${WORKERS:-1}
      # 直接 HTTP 访问保持 false，使用 HTTPS 反向代理时设为 true。
      NAS_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # 给予扫描与媒体子进程正常停止的时间。
    stop_grace_period: 30s
    # 阻止容器进程通过 setuid 等机制提升权限。
    security_opt:
      - no-new-privileges:true
    # 限制容器日志占用，业务数据库不受此设置影响。
    logging:
      # 使用 Docker 本地轮转日志驱动。
      driver: local
      # 单日志大小与保留数量。
      options:
        # 每份日志最大 10 MiB。
        max-size: "10m"
        # 最多保留 3 份日志。
        max-file: "3"
# 应用数据持久卷位于 Docker 本机存储；禁止改到 SMB/NFS。
volumes:
  # 保存 library.db、缓存等应用数据；不包含媒体原文件。
  nas_data:
