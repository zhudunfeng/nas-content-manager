# 可选托管部署：与compose.yaml一起使用；不要同时叠加旧downloads/search覆盖文件。
services:
  # 主应用不持有Docker socket，只读已发布连接与完成区。
  nas:
    # 预接好固定路径，网页无法给运行容器追加挂载。
    volumes:
      - ${ENGINE_HOST_ROOT:?请设置Docker宿主专用根}/downloads:/downloads:ro
      # 组件独立资源根只读；只有library子树允许登记。
      - ${ENGINE_HOST_ROOT:?请设置Docker宿主专用根}/collection-media:/collection-media:ro
      - ${ENGINE_HOST_ROOT:?请设置Docker宿主专用根}/connections:/run/nas-engines:ro
      - engine_ipc:/run/nas-engine-helper:ro
    # 托管模式允许首次没有连接凭据，保留媒体服务启动。
    environment:
      # 显式选择托管下载；优先于旧NAS_DOWNLOAD_ENABLED。
      NAS_DOWNLOAD_MODE: managed
      # 显式选择托管搜索；优先于旧NAS_TORRENT_SEARCH_ENABLED。
      NAS_TORRENT_SEARCH_MODE: managed
      # 应用侧只读下载根，只有complete允许登记媒体。
      NAS_DOWNLOAD_ROOT: /downloads
      # 引擎侧路径必须与固定模板的同一挂载一致。
      NAS_DOWNLOAD_ENGINE_ROOT: /downloads
      # 搜索媒体目录只授权完成子树，不能授权整个下载根。
      NAS_MEDIA_ROOTS: /media:/downloads/complete:/collection-media/library
      # 私有助手socket路径，未挂载时仅显示部署指引。
      NAS_ENGINE_HELPER_SOCKET: /run/nas-engine-helper/helper.sock
      # 整个目录只读bind使原子替换清单可见。
      NAS_ENGINE_CONNECTION_DIR: /run/nas-engines
      # 下载独立磁盘预留，单位GiB。
      NAS_DOWNLOAD_MIN_FREE_GB: ${DOWNLOAD_MIN_FREE_GB:-2}
    # 连接应用专用网络，引擎初始化时加入同一个bridge。
    networks:
      - engine_bridge
    # 助手先创建私有目录，但引擎仍需用户点击初始化。
    depends_on:
      - nas-engine-helper
  # 助手持有真实Docker管理权限，必须视为受信任部署组件。
  nas-engine-helper:
    # 本地构建镜像，不虚构已发布的公共镜像。
    image: nas-engine-helper:0.1.0
    # 仅构建小型Go助手，不复制前端和媒体文件。
    build:
      # 构建上下文为仓库根。
      context: .
      # 专用助手构建文件。
      dockerfile: Dockerfile.engine-helper
    # 宿主重启后恢复助手和未完成授权任务。
    restart: unless-stopped
    # 持久配置专用根与daemon socket；应用没有这些权限。
    volumes:
      - ${ENGINE_HOST_ROOT:?请设置Docker宿主专用根}:/managed
      - /var/run/docker.sock:/var/run/docker.sock
      - engine_ipc:/ipc
    # 所有路径/端口来自运维环境，浏览器不能覆盖。
    environment:
      # 允许用户从平台明确部署四种固定资源组件；打开页面不会安装。
      ENGINE_COLLECTION_ENABLED: "true"
      # 传给Docker的宿主根，必须与上方bind source精确一致。
      ENGINE_HOST_ROOT: ${ENGINE_HOST_ROOT:?请设置Docker宿主专用根}
      # Docker网络实际名称，不能使用Compose内部短键代替。
      ENGINE_NETWORK: ${ENGINE_NETWORK:-nas_engine_bridge}
      # 下载及配置进程身份，专用目录需同UID权限。
      ENGINE_UID: ${ENGINE_UID:-1000}
      # 应用连接文件与socket读取组，默认主应用GID1000。
      ENGINE_GID: ${ENGINE_GID:-1000}
      # BT固定TCP/UDP端口，不是网页或助手控制端口。
      QBT_PEER_PORT: ${QBT_PEER_PORT:-6881}
      # Jackett管理入口仅监听宿主127.0.0.1，远程使用SSH隧道。
      JACKETT_SETUP_PORT: ${JACKETT_SETUP_PORT:-19117}
    # 阻止setuid带来额外权限；Docker管理权限仍然真实存在。
    security_opt:
      - no-new-privileges:true
    # 给拉取请求取消、数据库释放和私有socket退出留时间。
    stop_grace_period: 30s
    # 助手接同一网络以探测受管引擎接口。
    networks:
      - engine_bridge
    # 控制日志占用，日志仅含脱敏中文阶段。
    logging:
      # Docker本地轮转日志。
      driver: local
      # 单文件及保留数量。
      options:
        # 每份最多10MiB。
        max-size: "10m"
        # 最多保留三份。
        max-file: "3"
# 网络必须允许出站，不能设置internal:true。
networks:
  # Compose创建bridge，初始化助手只检查及加入，不任意创建网络。
  engine_bridge:
    # 显式可预测名称需与ENGINE_NETWORK完全一致。
    name: ${ENGINE_NETWORK:-nas_engine_bridge}
    # 首版仅支持标准Linux bridge。
    driver: bridge
# IPC不含密钥，socket仍以0660/GID保护。
volumes:
  # 应用只读挂载同一卷，助手独占写socket。
  engine_ipc:
